<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142334">
  <meta name="description" content="Private construction project expense tracking, right in your browser.">
  <title>SiteLedger — Project expenses</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="svg-defs" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21.5v-3h4v3"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M5 3v18l3-2 4 2 4-2 3 2V3l-3 2-4-2-4 2-3-2Z"/><path d="M9 10h6M9 14h6"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="15" cy="17" r="2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5m6 6-6-6 6-6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18m-5 6h2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 17V5m-4 4 4-4 4 4M4 17v3h16v-3"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 2 8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-4Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="m3 17 1 4 4-1L20 8a3 3 0 0 0-4-4L4 16l-1 1Z"/><path d="m14 6 4 4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.5"/></symbol>
    <symbol id="i-trending" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8m-6 0h6v6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
    <symbol id="i-map-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6.5 7.5V19l-3 2v-8.5L4 5Z"/></symbol>
    <symbol id="i-harddrive" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 14h18m-5 2.5h.01m-4 0h.01"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2h8l5 5v15H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z"/><path d="M14 2v6h5M8 13h8m-8 4h8"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5m0 3v.5"/></symbol>
  </svg>

  <div class="app-shell">
    <div class="mobile-shade" id="mobileShade"></div>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-mark"><span class="brand-mark-lines"></span></div>
        <div class="brand-wordmark"><strong>SITELEDGER</strong><small>PROJECT FINANCE</small></div>
      </div>
      <div class="sidebar-group-title">WORKSPACE</div>
      <nav class="sidebar-nav" id="sidebarNav" aria-label="Pages">
        <button class="nav-link" data-route="add"><svg class="ico"><use href="#i-plus"/></svg><span>Add expense</span><span class="nav-shortcut">01</span></button>
        <button class="nav-link" data-route="projects"><svg class="ico"><use href="#i-building"/></svg><span>Projects</span><span class="nav-shortcut">02</span></button>
        <button class="nav-link" data-route="expenses"><svg class="ico"><use href="#i-receipt"/></svg><span>All expenses</span><span class="nav-shortcut">03</span></button>
        <button class="nav-link" data-route="overview"><svg class="ico"><use href="#i-grid"/></svg><span>Overview</span><span class="nav-shortcut">04</span></button>
      </nav>
      <div class="sidebar-divider"></div>
      <div class="sidebar-group-title">PREFERENCES</div>
      <nav class="sidebar-nav">
        <button class="nav-link" data-route="settings"><svg class="ico"><use href="#i-sliders"/></svg><span>Settings & backups</span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-bottom">
        <div class="local-badge"><span class="status-dot"></span><div><strong>Private workspace</strong><small>Stored in this browser</small></div><svg class="ico"><use href="#i-lock"/></svg></div>
        <div class="sidebar-footer">SITELEDGER <span>·</span> v1.0</div>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-button mobile-menu" id="openSidebar" aria-label="Open menu"><svg class="ico"><use href="#i-menu"/></svg></button><span class="topbar-breadcrumb" id="topBreadcrumb">Workspace <span>/</span> Add expense</span></div>
        <div class="topbar-right"><div class="topbar-date" id="headerDate"></div><div class="topbar-separator"></div><div class="avatar" id="headerAvatar" aria-label="Business">BC</div></div>
      </header>
      <div id="storageWarning" class="storage-warning" hidden></div>
      <main id="view" class="main-content" tabindex="-1"></main>
      <footer class="page-footer"><span>SiteLedger · Made for the day-to-day</span><span>All data stays on this device until you export it</span></footer>
    </div>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
  <script src="./app.js" defer></script>
</body>
</html>
